services:
  backend:
    image: calculator-backend
    build: ./tariff-api
    container_name: tariff-api
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      REALM: ${REALM}
      REDIRECT_URI: ${REDIRECT_URI}
      REQUIRED_ROLE: ${REQUIRED_ROLE}
      PORT: ${BACKEND_PORT}
      DB_DSN: ${DB_DSN}
    working_dir: /app
    volumes:
      - ./.env:/app/.env:ro
    command: [ "app" ]
    networks:
      - backend_network

  frontend:
    image: calculator-frontend
    build:
      context: ./frontend
      args:
        VITE_URL: http://10.100.44.26:${BACKEND_PORT}
    container_name: tariff-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge
