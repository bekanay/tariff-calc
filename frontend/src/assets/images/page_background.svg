<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7fa" stop-opacity="1" />
      <stop offset="50%" stop-color="#e8edf2" stop-opacity="1" />
      <stop offset="100%" stop-color="#f5f7fa" stop-opacity="1" />
    </linearGradient>
    
    <!-- Radial gradients for blobs -->
    <radialGradient id="blob1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="blob2">
      <stop offset="0%" stop-color="#e0e5ea" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e0e5ea" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Base gradient background -->
  <rect width="1920" height="1080" fill="url(#mainGradient)"/>
  
  <!-- Decorative blobs -->
  <circle cx="200" cy="150" r="250" fill="url(#blob1)"/>
  <circle cx="1700" cy="200" r="300" fill="url(#blob1)"/>
  <circle cx="300" cy="900" r="200" fill="url(#blob2)"/>
  <circle cx="1600" cy="850" r="280" fill="url(#blob1)"/>
  
  <!-- Geometric shapes -->
  <circle cx="150" cy="200" r="80" fill="#ffffff" opacity="0.4"/>
  <circle cx="1800" cy="250" r="100" fill="#ffffff" opacity="0.5"/>
  <circle cx="250" cy="850" r="60" fill="#ffffff" opacity="0.35"/>
  <circle cx="1750" cy="900" r="90" fill="#ffffff" opacity="0.45"/>
  
  <!-- Small accent circles -->
  <circle cx="400" cy="300" r="15" fill="#d1d8df" opacity="0.6"/>
  <circle cx="1500" cy="400" r="20" fill="#d1d8df" opacity="0.5"/>
  <circle cx="500" cy="700" r="18" fill="#d1d8df" opacity="0.55"/>
  <circle cx="1400" cy="650" r="12" fill="#d1d8df" opacity="0.65"/>
  <circle cx="800" cy="150" r="10" fill="#d1d8df" opacity="0.7"/>
  <circle cx="1100" cy="950" r="14" fill="#d1d8df" opacity="0.6"/>
  
  <!-- Grid pattern overlay -->
  <g opacity="0.15">
    <line x1="0" y1="270" x2="1920" y2="270" stroke="#c5cbd3" stroke-width="1"/>
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#c5cbd3" stroke-width="1"/>
    <line x1="0" y1="810" x2="1920" y2="810" stroke="#c5cbd3" stroke-width="1"/>
    
    <line x1="480" y1="0" x2="480" y2="1080" stroke="#c5cbd3" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke="#c5cbd3" stroke-width="1"/>
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#c5cbd3" stroke-width="1"/>
  </g>
  
  <!-- Abstract shapes in corners -->
  <path d="M 0 0 Q 150 100 0 200 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M 1920 0 Q 1770 100 1920 200 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M 0 1080 Q 150 980 0 880 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M 1920 1080 Q 1770 980 1920 880 Z" fill="#ffffff" opacity="0.3"/>
  
  <!-- Truck silhouette (left side) -->
  <g opacity="0.15" transform="translate(100, 500)">
    <rect x="0" y="20" width="120" height="60" rx="5" fill="#b8bfc7"/>
    <rect x="15" y="35" width="90" height="30" fill="#b8bfc7"/>
    <circle cx="30" cy="85" r="15" fill="#b8bfc7"/>
    <circle cx="100" cy="85" r="15" fill="#b8bfc7"/>
    <rect x="105" y="35" width="30" height="30" rx="3" fill="#b8bfc7"/>
  </g>
  
  <!-- Box/Package icon (right side) -->
  <g opacity="0.15" transform="translate(1650, 450)">
    <rect x="0" y="0" width="100" height="100" rx="5" fill="#b8bfc7"/>
    <line x1="0" y1="20" x2="100" y2="20" stroke="#a0a8b0" stroke-width="4"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="#a0a8b0" stroke-width="4"/>
  </g>
  
  <!-- Dots pattern -->
  <g opacity="0.3">
    <circle cx="600" cy="200" r="4" fill="#c5cbd3"/>
    <circle cx="650" cy="220" r="4" fill="#c5cbd3"/>
    <circle cx="700" cy="180" r="4" fill="#c5cbd3"/>
    
    <circle cx="1200" cy="800" r="4" fill="#c5cbd3"/>
    <circle cx="1250" cy="820" r="4" fill="#c5cbd3"/>
    <circle cx="1300" cy="780" r="4" fill="#c5cbd3"/>
  </g>
  
  <!-- Subtle wave pattern -->
  <path d="M 0 400 Q 240 380 480 400 T 960 400 T 1440 400 T 1920 400" 
        stroke="#d8dde3" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M 0 680 Q 240 660 480 680 T 960 680 T 1440 680 T 1920 680" 
        stroke="#d8dde3" stroke-width="2" fill="none" opacity="0.3"/>
</svg>