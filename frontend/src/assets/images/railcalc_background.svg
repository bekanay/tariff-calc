<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafbfc" stop-opacity="1" />
      <stop offset="100%" stop-color="#f5f7fa" stop-opacity="1" />
    </linearGradient>
    
    <!-- Blue accent gradient -->
    <radialGradient id="blueBlob">
      <stop offset="0%" stop-color="#3D88F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3D88F1" stop-opacity="0" />
    </radialGradient>
    
    <!-- Soft gray gradient -->
    <radialGradient id="grayBlob">
      <stop offset="0%" stop-color="#e8ecf1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e8ecf1" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#mainGradient)"/>
  
  <!-- Large decorative blobs -->
  <circle cx="1400" cy="300" r="400" fill="url(#blueBlob)"/>
  <circle cx="400" cy="800" r="350" fill="url(#grayBlob)"/>
  <circle cx="1600" cy="850" r="300" fill="url(#blueBlob)"/>
  
  <!-- Railway track pattern - top right -->
  <g opacity="0.06" transform="translate(1200, 150)">
    <line x1="0" y1="0" x2="300" y2="200" stroke="#3D88F1" stroke-width="8"/>
    <line x1="0" y1="15" x2="300" y2="215" stroke="#3D88F1" stroke-width="8"/>
    <!-- Sleepers -->
    <line x1="20" y1="-10" x2="30" y2="20" stroke="#3D88F1" stroke-width="4"/>
    <line x1="60" y1="20" x2="70" y2="50" stroke="#3D88F1" stroke-width="4"/>
    <line x1="100" y1="50" x2="110" y2="80" stroke="#3D88F1" stroke-width="4"/>
    <line x1="140" y1="80" x2="150" y2="110" stroke="#3D88F1" stroke-width="4"/>
    <line x1="180" y1="110" x2="190" y2="140" stroke="#3D88F1" stroke-width="4"/>
    <line x1="220" y1="140" x2="230" y2="170" stroke="#3D88F1" stroke-width="4"/>
    <line x1="260" y1="170" x2="270" y2="200" stroke="#3D88F1" stroke-width="4"/>
  </g>
  
  <!-- Railway track pattern - bottom left -->
  <g opacity="0.05" transform="translate(100, 700)">
    <line x1="0" y1="0" x2="350" y2="150" stroke="#3D88F1" stroke-width="8"/>
    <line x1="0" y1="15" x2="350" y2="165" stroke="#3D88F1" stroke-width="8"/>
    <!-- Sleepers -->
    <line x1="30" y1="-5" x2="40" y2="20" stroke="#3D88F1" stroke-width="4"/>
    <line x1="80" y1="15" x2="90" y2="40" stroke="#3D88F1" stroke-width="4"/>
    <line x1="130" y1="35" x2="140" y2="60" stroke="#3D88F1" stroke-width="4"/>
    <line x1="180" y1="55" x2="190" y2="80" stroke="#3D88F1" stroke-width="4"/>
    <line x1="230" y1="75" x2="240" y2="100" stroke="#3D88F1" stroke-width="4"/>
    <line x1="280" y1="95" x2="290" y2="120" stroke="#3D88F1" stroke-width="4"/>
    <line x1="320" y1="115" x2="330" y2="140" stroke="#3D88F1" stroke-width="4"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="250" cy="200" r="50" fill="#3D88F1" opacity="0.04"/>
  <circle cx="1700" cy="250" r="70" fill="#3D88F1" opacity="0.05"/>
  <circle cx="300" cy="900" r="40" fill="#e8ecf1" opacity="0.5"/>
  <circle cx="1650" cy="850" r="60" fill="#e8ecf1" opacity="0.5"/>
  
  <!-- Small accent dots -->
  <g opacity="0.15">
    <circle cx="500" cy="300" r="8" fill="#3D88F1"/>
    <circle cx="580" cy="350" r="6" fill="#3D88F1"/>
    <circle cx="650" cy="280" r="7" fill="#3D88F1"/>
    
    <circle cx="1300" cy="600" r="8" fill="#3D88F1"/>
    <circle cx="1380" cy="650" r="6" fill="#3D88F1"/>
    <circle cx="1450" cy="580" r="7" fill="#3D88F1"/>
  </g>
  
  <!-- Minimalistic train silhouette -->
  <g opacity="0.04" transform="translate(200, 450)">
    <rect x="0" y="40" width="160" height="60" rx="8" fill="#3D88F1"/>
    <rect x="10" y="50" width="45" height="35" rx="5" fill="#3D88F1"/>
    <rect x="65" y="50" width="45" height="35" rx="5" fill="#3D88F1"/>
    <rect x="120" y="50" width="35" height="35" rx="5" fill="#3D88F1"/>
    <rect x="135" y="25" width="25" height="15" rx="3" fill="#3D88F1"/>
    <circle cx="25" cy="105" r="10" fill="#3D88F1"/>
    <circle cx="60" cy="105" r="10" fill="#3D88F1"/>
    <circle cx="95" cy="105" r="10" fill="#3D88F1"/>
    <circle cx="130" cy="105" r="10" fill="#3D88F1"/>
  </g>
  
  <!-- Subtle grid lines -->
  <g opacity="0.03">
    <line x1="0" y1="360" x2="1920" y2="360" stroke="#3D88F1" stroke-width="1"/>
    <line x1="0" y1="720" x2="1920" y2="720" stroke="#3D88F1" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="1080" stroke="#3D88F1" stroke-width="1"/>
    <line x1="1280" y1="0" x2="1280" y2="1080" stroke="#3D88F1" stroke-width="1"/>
  </g>
  
  <!-- Abstract corner shapes -->
  <path d="M 0 0 Q 80 60 0 120 Z" fill="#e8ecf1" opacity="0.3"/>
  <path d="M 1920 0 Q 1840 60 1920 120 Z" fill="#e8ecf1" opacity="0.3"/>
  
  <!-- Decorative route line visualization -->
  <g opacity="0.05">
    <circle cx="800" cy="500" r="12" fill="#3D88F1"/>
    <circle cx="1100" cy="350" r="12" fill="#3D88F1"/>
    <path d="M 800 500 Q 950 400 1100 350" stroke="#3D88F1" stroke-width="4" fill="none"/>
  </g>
</svg>